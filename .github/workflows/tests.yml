name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build for
    # setup-python, and 3.9 is still the requires-python floor.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python) and current.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # A regular (non-editable) install, so a missing package-data entry or a
      # broken entry point fails here rather than for whoever installs it next.
      - name: Install
        run: python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Installed package smoke test
        working-directory: ${{ runner.temp }}
        run: |
          atlas-review --help > /dev/null
          python - <<'PY'
          import atlas_review
          from atlas_review.report import ASSETS
          for name in ("report.js", "report.css"):
              path = ASSETS / name
              assert path.is_file() and path.stat().st_size > 0, path
          assert "site-packages" in atlas_review.__file__, atlas_review.__file__
          print("atlas-review", atlas_review.__version__, "assets ok")
          PY
